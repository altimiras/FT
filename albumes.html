<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Álbumes de Google Fotos</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #202124;
      --text-secondary: #5f6368;
      --accent-color: #1a73e8;
      --border-color: #e0e0e0;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.14);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 30px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #1f1f1f;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Grilla de Tarjetas */
    .grid-albumes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Estilo de la Tarjeta */
    .tarjeta-album {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .tarjeta-album:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-color);
    }

    .tarjeta-album::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background-color: var(--accent-color);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .tarjeta-album:hover::before {
      opacity: 1;
    }

    .tarjeta-header {
      margin-bottom: 16px;
    }

    .icono-album {
      font-size: 1.8rem;
      margin-bottom: 10px;
      display: inline-block;
    }

    .titulo-album {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-color);
      word-break: break-word;
    }

    .cuenta-origen {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .tarjeta-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent-color);
    }

    .flecha {
      transition: transform 0.2s ease;
    }

    .tarjeta-album:hover .flecha {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🖼️ Mis Álbumes de Google Fotos</h1>
      <p>Selecciona una tarjeta para abrir el álbum en una nueva pestaña</p>
    </header>

    <main class="grid-albumes">

      <!-- Ejemplo 1: Reemplaza la URL entre comillas sencillas -->
      <article class="tarjeta-album" onclick="irAlAlbum('https://photos.app.goo.gl/TU_ENLACE_AQUI_1')">
        <div class="tarjeta-header">
          <span class="icono-album">🏖️</span>
          <h2 class="titulo-album">Vacaciones Verano 2025</h2>
          <div class="cuenta-origen">Cuenta: Personal</div>
        </div>
        <div class="tarjeta-footer">
          <span>Abrir álbum</span>
          <span class="flecha">➔</span>
        </div>
      </article>

      <!-- Ejemplo 2 -->
      <article class="tarjeta-album" onclick="irAlAlbum('https://photos.app.goo.gl/TU_ENLACE_AQUI_2')">
        <div class="tarjeta-header">
          <span class="icono-album">🎂</span>
          <h2 class="titulo-album">Cumpleaños Familiar</h2>
          <div class="cuenta-origen">Cuenta: Familiar</div>
        </div>
        <div class="tarjeta-footer">
          <span>Abrir álbum</span>
          <span class="flecha">➔</span>
        </div>
      </article>

      <!-- Ejemplo 3 -->
      <article class="tarjeta-album" onclick="irAlAlbum('https://photos.app.goo.gl/TU_ENLACE_AQUI_3')">
        <div class="tarjeta-header">
          <span class="icono-album">📸</span>
          <h2 class="titulo-album">Fotos e Imágenes Antiguas</h2>
          <div class="cuenta-origen">Cuenta: Archivo</div>
        </div>
        <div class="tarjeta-footer">
          <span>Abrir álbum</span>
          <span class="flecha">➔</span>
        </div>
      </article>

      <!-- Pega aquí los nuevos bloques que agregues -->

    </main>
  </div>

  <script>
    function irAlAlbum(url) {
      if (url && !url.includes('TU_ENLACE_AQUI')) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        alert('Recuerda colocar el enlace real del álbum en el código HTML de esta tarjeta.');
      }
    }
  </script>

</body>
</html>
