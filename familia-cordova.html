<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Árbol y Enlaces Familia Córdova</title>
  <style>
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
    html,body{min-height:100%;margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background-color:#FAF3EB;color:#2F2622}
    .container{max-width:56rem;margin:2rem auto;padding:1.5rem}
    .card{background-color:#fff;border-radius:0.75rem;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);padding:1.5rem;border:1px solid #e5e7eb}
    .title{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;color:#1f2937}
    .subtitle{font-size:0.875rem;color:#4b5563;margin-bottom:1.5rem}
    .item-row{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;margin-bottom:0.5rem;background-color:#fff8f0;border:1px solid #f3e8dc;border-radius:0.5rem}
    .info-group{display:flex;align-items:center;gap:0.75rem}
    .tag-anio{background-color:#2f2622;color:#fff;font-size:0.75rem;font-weight:bold;padding:0.25rem 0.5rem;border-radius:0.25rem}
    .item-name{font-weight:600;color:#374151}
    .link-btn{background-color:#0284c7;color:#fff;padding:0.375rem 0.75rem;border-radius:0.375rem;text-decoration:none;font-size:0.875rem;font-weight:500}
  </style>
</head>
<body>

  <main class="container">
    <div class="card">
      <h1 class="title">Familia Córdova - Registros y Enlaces</h1>
      <p class="subtitle">Filtrado activo: solo registros con categoría <code>2</code></p>
      <div id="contenedor-enlaces">Cargando enlaces...</div>
    </div>
  </main>

  <script>
    fetch('cordova-link.txt')
      .then(res => res.text())
      .then(texto => {
        const contenedor = document.getElementById('contenedor-enlaces');
        contenedor.innerHTML = '';

        const lineas = texto.split('\n');
        lineas.forEach(linea => {
          const l = linea.trim();
          if (l && !l.startsWith('#')) {
            const [anio, codigo, nombre, link] = l.split('|');

            // Filtro: Solo procesa si el segundo campo limpia espacio y es igual a "2"
            if (codigo && codigo.trim() === '2' && nombre && link) {
              contenedor.innerHTML += `
                <div class="item-row">
                  <div class="info-group">
                    <span class="tag-anio">${anio}</span>
                    <span class="item-name">${nombre}</span>
                  </div>
                  <a href="${link}" target="_blank" rel="noopener noreferrer" class="link-btn">
                    Abrir enlace
                  </a>
                </div>
              `;
            }
          }
        });

        if (contenedor.innerHTML === '') {
          contenedor.innerHTML = '<p>No se encontraron registros con el código 2.</p>';
        }
      })
      .catch(err => {
        document.getElementById('contenedor-enlaces').innerText = 'Error al cargar cordova-link.txt';
      });
  </script>
</body>
</html>
