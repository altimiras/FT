<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familia Córdova - Enlaces y Registros</title>
  <style>
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
    html,body,#root{min-height:100%;margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background-color:#FAF3EB;color:#2F2622}
    .container{max-width:56rem;margin:2rem auto;padding:1.5rem}
    .card{background-color:#fff;border-radius:0.75rem;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);padding:1.5rem;border:1px solid #e5e7eb}
    .title{font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;color:#1f2937}
    .subtitle{font-size:0.875rem;color:#4b5563;margin-bottom:1.5rem}
    .item-row{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;margin-bottom:0.5rem;background-color:#fff8f0;border:1px solid #f3e8dc;border-radius:0.5rem;transition:background-color 0.2s}
    .item-row:hover{background-color:#f5ece0}
    .tag{background-color:#2f2622;color:#fff;font-size:0.75rem;font-weight:bold;padding:0.25rem 0.5rem;border-radius:0.25rem;margin-right:0.75rem}
    .item-name{font-weight:600;color:#374151;flex-grow:1}
    .link-btn{background-color:#0284c7;color:#fff;padding:0.375rem 0.75rem;border-radius:0.375rem;text-decoration:none;font-size:0.875rem;font-weight:500}
    .link-btn:hover{background-color:#0369a1}
    .error-box{background-color:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:1rem;border-radius:0.5rem}
    .loading{color:#4b5563;text-align:center;padding:2rem}
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [registros, setRegistros] = useState([]);
      const [cargando, setCargando] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch('./cordova-link.txt')
          .then((response) => {
            if (!response.ok) {
              throw new Error(`No se pudo cargar el archivo (código: ${response.status})`);
            }
            return response.text();
          })
          .then((texto) => {
            // Procesamiento del texto formateado por líneas: Año|1|nombre|link
            const lineas = texto.split('\n');
            const listaParseada = lineas
              .map((linea) => linea.trim())
              .filter((linea) => linea.length > 0 && !linea.startsWith('#'))
              .map((linea) => {
                const partes = linea.split('|');
                return {
                  anio: partes[0] ? partes[0].trim() : '',
                  codigo: partes[1] ? partes[1].trim() : '',
                  nombre: partes[2] ? partes[2].trim() : '',
                  link: partes[3] ? partes[3].trim() : '#'
                };
              });

            setRegistros(listaParseada);
            setCargando(false);
          })
          .catch((err) => {
            console.error(err);
            setError(err.message);
            setCargando(false);
          });
      }, []);

      if (cargando) {
        return <div className="loading">Cargando datos desde <code>cordova-link.txt</code>...</div>;
      }

      if (error) {
        return (
          <div className="container">
            <div className="error-box">
              <h3>Error de Carga</h3>
              <p>{error}</p>
              <small>Verifica que <code>cordova-link.txt</code> esté presente en el mismo directorio.</small>
            </div>
          </div>
        );
      }

      return (
        <main className="container">
          <div className="card">
            <h1 className="title">Familia Córdova - Registros y Enlaces</h1>
            <p className="subtitle">Visualizando datos extraídos del formato <code>Año|1|Nombre|Link</code></p>

            <div className="list-container">
              {registros.length === 0 ? (
                <p>No se encontraron registros en el archivo.</p>
              ) : (
                registros.map((item, index) => (
                  <div key={index} className="item-row">
                    <div>
                      <span className="tag">{item.anio}</span>
                      <span className="item-name">{item.nombre}</span>
                    </div>
                    <a 
                      href={item.link} 
                      target="_blank" 
                      rel="noopener noreferrer" 
                      className="link-btn"
                    >
                      Ver Enlace
                    </a>
                  </div>
                ))
              )}
            </div>
          </div>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
