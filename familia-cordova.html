<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Árbol y Enlaces Familia Córdova</title>
  <style>
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
    html,body{min-height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background-color:#FAF3EB;color:#2F2622}
    .container{max-width:56rem;margin:2rem auto;padding:1.5rem;position:relative}
    .card{background-color:#fff;border-radius:0.75rem;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);padding:1.5rem;border:1px solid #e5e7eb;position:relative}
    
    /* Etiqueta de versión superior derecha */
    .version-badge{position:absolute;top:1rem;right:1rem;background-color:#e5e7eb;color:#4b5563;font-size:0.75rem;font-weight:700;padding:0.2rem 0.5rem;border-radius:0.25rem}

    /* Pantalla de Acceso / Login */
    .login-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;text-align:center}
    .login-title{font-size:1.25rem;font-weight:700;margin-bottom:0.5rem;color:#1f2937}
    .login-subtitle{font-size:0.875rem;color:#6b7280;margin-bottom:1.25rem}
    .login-input{padding:0.6rem 1rem;border:1px solid #d1d5db;border-radius:0.375rem;font-size:1rem;outline:none;width:100%;max-width:16rem;margin-bottom:1rem;text-align:center}
    .login-input:focus{border-color:#0284c7;box-shadow:0 0 0 2px rgba(2,132,199,0.2)}
    .login-btn{background-color:#2F2622;color:#fff;padding:0.6rem 1.5rem;border-radius:0.375rem;font-weight:600;font-size:0.9rem;cursor:pointer;transition:background-color 0.2s}
    .login-btn:hover{background-color:#4a3e38}
    .error-txt{color:#dc2626;font-size:0.85rem;margin-top:0.75rem;display:none}

    /* Contenido Principal (Oculto hasta ingresar clave) */
    #contenido-privado{display:none}
    .title{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;color:#1f2937}
    .subtitle{font-size:0.875rem;color:#4b5563;margin-bottom:1.5rem}

    /* Tarjetas de enlaces */
    .item-card{display:flex;align-items:center;justify-content:space-between;padding:0.875rem 1.25rem;margin-bottom:0.625rem;background-color:#FFF8F0;border:1px solid #F3E8DC;border-radius:0.5rem;transition:all 0.2s ease}
    .item-card:hover{background-color:#F5ECE0;border-color:#E8D5C4}
    .badge-year{background-color:#2F2622;color:#FFFFFF;font-size:0.75rem;font-weight:700;padding:0.25rem 0.625rem;border-radius:0.25rem;margin-right:0.875rem}
    .item-title{font-weight:600;color:#2F2622;font-size:0.95rem}
    .btn-link{background-color:#0284c7;color:#ffffff;padding:0.4rem 0.875rem;border-radius:0.375rem;text-decoration:none;font-size:0.85rem;font-weight:500;transition:background-color 0.2s}
    .btn-link:hover{background-color:#0369a1}
  </style>
</head>
<body>

  <main class="container">
    <div class="card">
      
      <!-- Indicador de Versión -->
      <span class="version-badge">v1.0.6</span>

      <!-- PANTALLA DE ACCESO POR CLAVE -->
      <div id="pantalla-login" class="login-box">
        <h2 class="login-title">Acceso Privado - Familia Córdova</h2>
        <p class="login-subtitle">Ingresa la clave para ver los enlaces y registros</p>
        <input type="password" id="claveInput" class="login-input" placeholder="Ingresa la clave..." onkeydown="if(event.key==='Enter') verificarClave()">
        <button onclick="verificarClave()" class="login-btn">Ingresar</button>
        <p id="errorClave" class="error-txt">Clave incorrecta. Inténtalo de nuevo.</p>
      </div>

      <!-- CONTENIDO PRINCIPAL (Protegido) -->
      <div id="contenido-privado">
        <header style="margin-bottom: 1.5rem;">
          <h1 class="title">Árbol y Enlaces Familia Córdova</h1>
          <p class="subtitle">Mostrando registros desde <code>cordova-link.txt</code> (Filtro: Código 2)</p>
        </header>

        <section id="contenedor-enlaces">
          <p style="font-size: 0.875rem; color: #4b5563;">Cargando datos familiares...</p>
        </section>
      </div>

    </div>
  </main>

  <script>
    // 1. Verificación de la clave de acceso ("erc")
    function verificarClave() {
      const clave = document.getElementById('claveInput').value.trim();
      const errorMsg = document.getElementById('errorClave');

      if (clave === 'erc') {
        document.getElementById('pantalla-login').style.display = 'none';
        document.getElementById('contenido-privado').style.display = 'block';
        errorMsg.style.display = 'none';
        
        // Cargar los datos desde el .txt solo tras ingresar la clave correcta
        cargarDatosTXT();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // 2. Carga y filtrado de cordova-link.txt (Filtro: código 2)
    function cargarDatosTXT() {
      fetch('cordova-link.txt')
        .then(res => {
          if (!res.ok) throw new Error('No se pudo acceder a cordova-link.txt');
          return res.text();
        })
        .then(texto => {
          const contenedor = document.getElementById('contenedor-enlaces');
          contenedor.innerHTML = '';

          // Limpieza de caracteres invisibles BOM (\uFEFF) y retornos de carro (\r)
          const textoLimpio = texto.replace(/^\uFEFF/, '').replace(/\r/g, '');
          const lineas = textoLimpio.split('\n');

          let contador = 0;

          lineas.forEach(linea => {
            const l = linea.trim();
            if (l && !l.startsWith('#')) {
              const partes = l.split('|');
              
              if (partes.length >= 4) {
                const anio = partes[0].trim();
                const codigoLimpio = partes[1].replace(/[^\d]/g, ''); // Limpia y deja solo dígitos
                const nombre = partes[2].trim();
                const link = partes[3].trim();

                // Evaluamos únicamente los registros con código 2
                if (codigoLimpio === '2' && nombre && link) {
                  contador++;
                  contenedor.innerHTML += `
                    <div class="item-card">
                      <div style="display: flex; align-items: center;">
                        <span class="badge-year">${anio}</span>
                        <span class="item-title">${nombre}</span>
                      </div>
                      <a href="${link}" target="_blank" rel="noopener noreferrer" class="btn-link">
                        Ver enlace
                      </a>
                    </div>
                  `;
                }
              }
            }
          });

          if (contador === 0) {
            contenedor.innerHTML = '<p style="font-size:0.875rem; color:#4b5563;">No se encontraron registros con código 2 en el archivo.</p>';
          }
        })
        .catch(err => {
          document.getElementById('contenedor-enlaces').innerHTML = `
            <div style="padding: 1rem; background-color: #fee2e2; border: 1px solid #fca5a5; border-radius: 0.5rem; color: #991b1b; font-size: 0.875rem;">
              <strong>Error:</strong> No se pudo cargar el archivo <code>cordova-link.txt</code>.
            </div>
          `;
        });
    }
  </script>
</body>
</html>
