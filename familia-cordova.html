<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Árbol y Enlaces Familia Córdova</title>
  <!-- Tailwind CSS compilado / Estilos originales -->
  <style>
    *,:after,:before{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;box-sizing:border-box;border:0 solid #e5e7eb}
    html,body,#root{min-height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background-color:#FAF3EB;color:#2F2622}
    .flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}
    .p-6{padding:1.5rem}.max-w-4xl{max-width:56rem}.mx-auto{margin-left:auto;margin-right:auto}
    .bg-white{background-color:#fff}.rounded-xl{border-radius:0.75rem}.shadow-md{box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}
    .text-2xl{font-size:1.5rem;line-height:2rem}.font-bold{font-weight:700}.mb-4{margin-bottom:1rem}.mb-6{margin-bottom:1.5rem}
    .border{border-width:1px}.border-gray-200{border-color:#e5e7eb}.p-4{padding:1rem}.my-2{margin-top:0.5rem;margin-bottom:0.5rem}
    .text-gray-600{color:#4b5563}.text-sm{font-size:0.875rem}.text-xs{font-size:0.75rem}
    .relative{position:relative}
    
    /* Etiqueta de versión superior derecha */
    .version-badge{position:absolute;top:1rem;right:1rem;background-color:#e5e7eb;color:#4b5563;font-size:0.75rem;font-weight:700;padding:0.2rem 0.5rem;border-radius:0.25rem}

    /* Estilos de lista de enlaces */
    .item-card{display:flex;align-items:center;justify-content:space-between;padding:0.875rem 1.25rem;margin-bottom:0.625rem;background-color:#FFF8F0;border:1px solid #F3E8DC;border-radius:0.5rem;transition:all 0.2s ease}
    .item-card:hover{background-color:#F5ECE0;border-color:#E8D5C4}
    .badge-year{background-color:#2F2622;color:#FFFFFF;font-size:0.75rem;font-weight:700;padding:0.25rem 0.625rem;border-radius:0.25rem;margin-right:0.875rem}
    .item-title{font-weight:600;color:#2F2622;font-size:0.95rem}
    .btn-link{background-color:#0284c7;color:#ffffff;padding:0.4rem 0.875rem;border-radius:0.375rem;text-decoration:none;font-size:0.85rem;font-weight:500;transition:background-color 0.2s}
    .btn-link:hover{background-color:#0369a1}
  </style>
</head>
<body>

  <main class="max-w-4xl mx-auto p-6 relative">
    <!-- Contenedor Principal con estilo original -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200 relative">
      
      <!-- Indicador de Versión -->
      <span class="version-badge">v1.0.5</span>

      <header class="mb-6">
        <h1 class="text-2xl font-bold">Árbol y Enlaces Familia Córdova</h1>
        <p class="text-sm text-gray-600">Mostrando registros desde <code>cordova-link.txt</code> (Filtro: Código 2)</p>
      </header>

      <section id="contenedor-enlaces">
        <div class="text-gray-600 text-sm">Cargando datos familiares...</div>
      </section>

    </div>
  </main>

  <script>
    fetch('cordova-link.txt')
      .then(res => {
        if (!res.ok) throw new Error('No se pudo acceder a cordova-link.txt');
        return res.text();
      })
      .then(texto => {
        const contenedor = document.getElementById('contenedor-enlaces');
        contenedor.innerHTML = '';

        // Limpieza de caracteres invisibles BOM (\uFEFF) y retornos de carro (\r)
        const textoLimpio = texto.replace(/^\uFEFF/, '').replace(/\r/g, '');
        const lineas = textoLimpio.split('\n');

        let contador = 0;

        lineas.forEach(linea => {
          const l = linea.trim();
          if (l && !l.startsWith('#')) {
            const partes = l.split('|');
            
            if (partes.length >= 4) {
              const anio = partes[0].trim();
              const codigoLimpio = partes[1].replace(/[^\d]/g, ''); // Limpia y deja solo dígitos
              const nombre = partes[2].trim();
              const link = partes[3].trim();

              // Evaluamos únicamente los registros con código 2
              if (codigoLimpio === '2' && nombre && link) {
                contador++;
                contenedor.innerHTML += `
                  <div class="item-card">
                    <div class="flex items-center">
                      <span class="badge-year">${anio}</span>
                      <span class="item-title">${nombre}</span>
                    </div>
                    <a href="${link}" target="_blank" rel="noopener noreferrer" class="btn-link">
                      Ver enlace
                    </a>
                  </div>
                `;
              }
            }
          }
        });

        if (contador === 0) {
          contenedor.innerHTML = '<p class="text-sm text-gray-600">No se encontraron registros con código 2 en el archivo.</p>';
        }
      })
      .catch(err => {
        document.getElementById('contenedor-enlaces').innerHTML = `
          <div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm">
            <strong>Error:</strong> No se pudo cargar el archivo <code>cordova-link.txt</code>.
          </div>
        `;
      });
  </script>
</body>
</html>
