<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reparador de Álbumes</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 15px; background: #f8f9fa; color: #333; max-width: 800px; margin: 0 auto; }
    h2 { color: #1a73e8; margin-bottom: 5px; }
    .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 10px; }
    button:active { background: #1557b0; }
    .btn-descargar { background: #188038; }
    .btn-descargar:active { background: #13652c; }
    
    .item-error { background: #fce8e6; border-left: 5px solid #d93025; padding: 12px; margin: 12px 0; border-radius: 4px; }
    .title-error { color: #c5221f; font-weight: bold; font-size: 15px; }
    .url-text { font-size: 12px; color: #5f6368; word-break: break-all; margin: 6px 0; }
    
    .input-fix { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; margin-top: 6px; background: #fff; }
    .input-fix:focus { border-color: #1a73e8; outline: none; background: #e8f0fe; }
    
    #resumen { font-size: 16px; font-weight: bold; margin-bottom: 15px; line-height: 1.5; }
    .badge-error { color: #d93025; }
    .badge-ok { color: #188038; }
    
    .acciones { display: flex; gap: 10px; margin: 8px 0; }
    .acciones a { text-decoration: none; font-size: 13px; color: #1a73e8; font-weight: bold; background: white; padding: 6px 12px; border-radius: 4px; border: 1px solid #dadce0; display: inline-block; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Reparador de Enlaces de Álbumes</h2>
    <p style="font-size:13px; color:#666;">Analiza <code>albumes.txt</code>, te permite corregir los links fallados en cada tarjeta y descargar la lista reparada.</p>
    <button onclick="analizarLista()">🔍 Iniciar / Cargar Análisis</button>
  </div>

  <div id="resumen"></div>

  <div class="box" id="bloque-errores" style="display:none;">
    <h3 style="color:#d93025; margin-top:0;">⚠️ Álbumes que requieren corregir enlace:</h3>
    <div id="lista-errores"></div>
    <button class="btn-descargar" onclick="descargarListaReparada()">💾 Descargar albumes_reparados.txt</button>
  </div>

  <script>
    let lineasOriginales = [];

    async function analizarLista() {
      const resumen = document.getElementById('resumen');
      const listaErrores = document.getElementById('lista-errores');
      const bloqueErrores = document.getElementById('bloque-errores');
      
      resumen.innerHTML = "⌛ Cargando albumes.txt...";
      listaErrores.innerHTML = "";
      bloqueErrores.style.display = "none";

      try {
        const resp = await fetch('albumes.txt?' + new Date().getTime());
        if (!resp.ok) throw new Error("No se pudo cargar el archivo albumes.txt");
        
        const texto = await resp.text();
        lineasOriginales = texto.split('\n');

        let errores = 0;
        let correctos = 0;

        for (let i = 0; i < lineasOriginales.length; i++) {
          const linea = lineasOriginales[i].trim();
          if (!linea) continue;

          const partes = linea.split('|');
          if (partes.length >= 4) {
            const anio = partes[0].trim();
            const cuenta = partes[1].trim();
            const nombre = partes[2].trim();
            const url = partes[3].trim();

            // Detecta URLs privadas o de sesión (/u/0/, /u/1/, /album/)
            const esEnlacePrivado = url.includes('/u/0/') || 
                                    url.includes('/u/1/') || 
                                    url.includes('/u/2/') || 
                                    (url.includes('photos.google.com/album/') && !url.includes('share'));

            if (esEnlacePrivado) {
              errores++;
              
              // Carga link guardado previamente si existe en memoria
              const linkGuardado = localStorage.getItem(`fix_album_${i}`) || '';

              const divErr = document.createElement('div');
              divErr.className = 'item-error';
              divErr.innerHTML = `
                <div class="title-error">❌ [${anio}] Cuenta ${cuenta}: ${nombre}</div>
                <div class="url-text">Link actual: <code>${url}</code></div>
                <div class="acciones">
                  <a href="${url}" target="_blank">🔗 Abrir álbum en Chrome</a>
                </div>
                <label style="font-size:12px; font-weight:bold; color:#333;">Pegar nuevo link de compartir público aquí:</label>
                <input type="text" class="input-fix" id="input_${i}" value="${linkGuardado}" 
                       placeholder="https://photos.app.goo.gl/..." 
                       oninput="guardarEnMemoria(${i}, this.value)">
              `;
              listaErrores.appendChild(divErr);
            } else {
              correctos++;
            }
          }
        }

        bloqueErrores.style.display = errores > 0 ? "block" : "none";
        
        resumen.innerHTML = `
          <strong>Estado de la lista:</strong><br>
          <span class="badge-error">❌ ${errores} álbumes con link privado para corregir.</span><br>
          <span class="badge-ok">✅ ${correctos} álbumes con formato correcto.</span>
        `;

        if (errores === 0) {
          resumen.innerHTML += "<br><br>🎉 ¡Todos los enlaces están correctos!";
        }

      } catch (err) {
        resumen.innerHTML = `<span style='color:red;'>⚠️ Error: ${err.message}. Asegúrate de que <b>albumes.txt</b> esté en la misma carpeta.</span>`;
      }
    }

    // Guarda los enlaces pegados en el almacenamiento local del navegador
    function guardarEnMemoria(index, valor) {
      localStorage.setItem(`fix_album_${index}`, valor.trim());
    }

    // Genera el archivo reparado uniendo las líneas originales con los enlaces corregidos
    function descargarListaReparada() {
      let lineasReparadas = [];

      for (let i = 0; i < lineasOriginales.length; i++) {
        const linea = lineasOriginales[i].trim();
        if (!linea) continue;

        const partes = linea.split('|');
        if (partes.length >= 4) {
          const anio = partes[0].trim();
          const cuenta = partes[1].trim();
          const nombre = partes[2].trim();
          const urlOriginal = partes[3].trim();

          const linkNuevo = localStorage.getItem(`fix_album_${i}`);

          // Si hay un link nuevo pegado, usa ese; si no, conserva el original
          const urlFinal = (linkNuevo && linkNuevo.length > 5) ? linkNuevo : urlOriginal;

          lineasReparadas.push(`${anio}|${cuenta}|${nombre}|${urlFinal}`);
        }
      }

      const contenido = lineasReparadas.join('\n');
      const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'albumes_reparados.txt';
      a.click();
    }
  </script>
</body>
</html>
